name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: My app stores image references in ... so orphan:scan reports them as orphans.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Example config or commands are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried, such as a custom extractor, normalizer or filter.

  - type: checkboxes
    id: pull-request
    attributes:
      label: Contribution
      options:
        - label: I am willing to send a pull request for this feature.
