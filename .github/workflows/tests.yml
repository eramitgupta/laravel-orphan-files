name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    name: Pint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: composer test:lint

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        php: [8.4, 8.3, 8.2]
        laravel: ['12.*', '13.*']

        include:
          - laravel: '12.*'
            testbench: '^10.0'

          - laravel: '13.*'
            testbench: '^11.0'

          # Each Pest major needs a newer PHP: Pest 3 on PHP 8.2+, Pest 4 on 8.3+ (PHPUnit 12), Pest 5 on 8.4.1+ (PHPUnit 13).
          - php: 8.2
            pest: '^3.0'

          - php: 8.3
            pest: '^4.0'

          - php: 8.4
            pest: '^5.0'

          # Pest 5 needs symfony/process 8, which Laravel 12 (Symfony 7) can't install.
          - php: 8.4
            laravel: '12.*'
            pest: '^4.0'

        exclude:
          # Laravel 13 requires PHP 8.3+
          - laravel: '13.*'
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - Pest ${{ matrix.pest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, intl
          coverage: none

      - name: Setup Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --dev --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: List installed versions
        run: composer show laravel/framework orchestra/testbench pestphp/pest

      - name: Run tests
        run: vendor/bin/pest --order-by=random

  # Runs the "database" test group (temporary reference table, spill, fallback) on real engines.
  mysql:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - connection: mysql
            image: mysql:8.4
          - connection: mariadb
            image: mariadb:11

    name: DB ${{ matrix.connection }}

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: orphan_storage
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword || mariadb-admin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orphan_storage
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite, fileinfo, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run database tests
        run: vendor/bin/pest --group=database

  pgsql:
    runs-on: ubuntu-latest

    name: DB pgsql

    services:
      database:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: orphan_storage
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: orphan_storage
      DB_USERNAME: postgres
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo, pdo_pgsql, pdo_sqlite, sqlite, fileinfo, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run database tests
        run: vendor/bin/pest --group=database

  sqlsrv:
    runs-on: ubuntu-latest

    name: DB sqlsrv

    # Not yet verified on a real SQL Server; failures are reported without failing the build.
    continue-on-error: true

    services:
      database:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Orphan-Storage-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Orphan-Storage-1 -Q 'select 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_CONNECTION: sqlsrv
      DB_HOST: 127.0.0.1
      DB_PORT: 1433
      DB_DATABASE: master
      DB_USERNAME: sa
      DB_PASSWORD: Orphan-Storage-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo, sqlsrv, pdo_sqlsrv, pdo_sqlite, sqlite, fileinfo, intl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run database tests
        run: vendor/bin/pest --group=database
